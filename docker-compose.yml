version: '3.8'

services:
  # Banco de dados MariaDB
  db:
    image: mariadb:11
    container_name: volei-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: volei
      MYSQL_USER: volei
      MYSQL_PASSWORD: volei2025
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - volei-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server (Express)
  api:
    build: .
    container_name: volei-api
    restart: unless-stopped
    command: npm run api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: volei
      DB_PASSWORD: volei2025
      DB_NAME: volei
      API_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - volei-network

  # Frontend (Vite)
  frontend:
    build: .
    container_name: volei-frontend
    restart: unless-stopped
    command: npm run dev
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - volei-network

volumes:
  db_data:
    driver: local

networks:
  volei-network:
    driver: bridge
