# Docker Compose para usar banco de dados remoto existente
# Use este arquivo quando já tiver um banco MariaDB em produção
# Comando: docker-compose -f docker-compose.remote-db.yml up -d

services:
  # API Server (Express)
  api:
    build: .
    platform: linux/amd64
    container_name: volei-api
    restart: unless-stopped
    command: npm run api
    environment:
      # Nginx-proxy configuration para /api
      VIRTUAL_HOST: ${VOLEI_DOMAIN}
      VIRTUAL_PATH: /api
      VIRTUAL_PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - volei-network
      - Infra  # Rede da infraestrutura (nginx-proxy, cloudflare-dns, etc)
    env_file:
      - .env
    labels:
      - "com.github.nginx-proxy.nginx-proxy.enable=true"

  # Frontend (Vite)
  frontend:
    build: .
    platform: linux/amd64
    container_name: volei-frontend
    restart: unless-stopped
    command: npm run dev
    environment:
      # Proxy Reverso (nginx-proxy-automation) - Detectado automaticamente
      VIRTUAL_HOST: ${VOLEI_DOMAIN}
      VIRTUAL_PORT: 8080

      # SSL (Let's Encrypt) - Gerado automaticamente pelo nginx-proxy
      LETSENCRYPT_HOST: ${VOLEI_DOMAIN}
      LETSENCRYPT_EMAIL: ${DEFAULT_EMAIL}

      # Cloudflare DNS Manager - Cria DNS A automaticamente
      CLOUDFLARE_AUTO_DNS: "true"
      CLOUDFLARE_PROXIED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - volei-network
      - Infra  # Rede da infraestrutura (nginx-proxy, cloudflare-dns, etc)
    env_file:
      - .env
    labels:
      # Labels para nginx-proxy encontrar o container
      - "com.github.nginx-proxy.nginx-proxy.enable=true"

networks:
  volei-network:
    driver: bridge

  # Rede da infraestrutura (externa)
  Infra:
    external: true
