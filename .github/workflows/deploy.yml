name: Deploy Vôlei dos amigos

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/volei

jobs:
  deploy:
    name: Deploy Vôlei to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create Deployment Package
        run: |
          # Empacotar todo o projeto (exceto node_modules, .git, etc)
          # Criar tar em /tmp para evitar "file changed as we read it"
          tar -czf /tmp/volei-deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.vinxi' \
            --exclude='.output' \
            --exclude='dist' \
            --exclude='*.log' \
            --exclude='.env.local' \
            -C . .
          mv /tmp/volei-deploy.tar.gz .

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          # Criar diretório remoto
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST "
            mkdir -p ${{ env.DEPLOY_PATH }}

            # Backup do .env se existir
            if [ -f ${{ env.DEPLOY_PATH }}/.env ]; then
              cp ${{ env.DEPLOY_PATH }}/.env ${{ env.DEPLOY_PATH }}/.env.backup
              echo 'Backup do .env criado'
            fi
          "

          # Enviar arquivos
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P $SSH_PORT volei-deploy.tar.gz $SSH_USER@$SSH_HOST:${{ env.DEPLOY_PATH }}/

          # Extrair e organizar
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST "
            cd ${{ env.DEPLOY_PATH }}

            # Limpar diretório (exceto .env)
            find . -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.env.backup' ! -name 'volei-deploy.tar.gz' -exec rm -rf {} +

            # Extrair novos arquivos
            tar -xzf volei-deploy.tar.gz
            rm volei-deploy.tar.gz

            # Restaurar .env
            if [ -f .env.backup ]; then
              mv .env.backup .env
              echo '.env restaurado'
            fi

            echo 'Arquivos extraídos e organizados'
          "

      - name: Deploy Application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          VOLEI_DOMAIN: ${{ secrets.VOLEI_DOMAIN }}
          DEFAULT_EMAIL: ${{ secrets.DEFAULT_EMAIL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_NAME: ${{ secrets.MYSQL_DATABASE }}
        run: |
          # Criar .env localmente com os valores
          cat > /tmp/.env << EOF
          # Proxy Reverso
          VOLEI_DOMAIN=$VOLEI_DOMAIN
          DEFAULT_EMAIL=$DEFAULT_EMAIL

          # Database Remoto
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME

          # API Config
          API_PORT=3001

          # Frontend Config (usa nome do serviço Docker, não localhost)
          VITE_API_URL=http://api:3001
          EOF

          echo "Conteúdo do .env criado (valores ocultos):"
          sed 's/=.*/=***/' /tmp/.env

          # Copiar .env para o servidor
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P $SSH_PORT /tmp/.env $SSH_USER@$SSH_HOST:${{ env.DEPLOY_PATH }}/.env

          # Ajustar permissões e fazer deploy
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST \
            "cd ${{ env.DEPLOY_PATH }} && \
             chmod 600 .env && \
             echo 'Parando containers antigos...' && \
             docker-compose -f docker-compose.remote-db.yml -p volei down 2>/dev/null || true && \
             echo 'Removendo imagens antigas...' && \
             docker rmi volei-frontend volei-api 2>/dev/null || true && \
             echo 'Limpando cache do Docker...' && \
             docker builder prune -f 2>/dev/null || true && \
             echo 'Construindo novas imagens (sem cache)...' && \
             docker-compose -f docker-compose.remote-db.yml -p volei build --no-cache --pull --force-rm && \
             echo 'Subindo serviços (API + Frontend - usando banco remoto)...' && \
             docker-compose -f docker-compose.remote-db.yml -p volei up -d && \
             echo 'Aguardando inicialização (20s)...' && \
             sleep 20 && \
             echo 'Status dos containers:' && \
             docker ps --filter 'name=volei' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' && \
             echo '' && \
             echo 'Últimos logs da API:' && \
             docker logs volei-api --tail=20 && \
             echo '' && \
             echo 'Últimos logs do frontend:' && \
             docker logs volei-frontend --tail=20"

      - name: Health Check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          VOLEI_DOMAIN: ${{ secrets.VOLEI_DOMAIN }}
        run: |
          sleep 10
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}

            echo "Verificando saúde dos serviços..."
            echo ""
            echo "[INFO] Usando banco de dados remoto: ${DB_HOST}:${DB_PORT}"
            echo ""

            # Verificar API
            echo ""
            if docker ps --filter "name=volei-api" --format "{{.Names}}" | grep -q volei-api; then
              echo "[OK] Container API está rodando"

              # Testar API
              if docker exec volei-api curl -f http://localhost:3001/api/players 2>/dev/null; then
                echo "[OK] API está respondendo"
              else
                echo "[AVISO] API ainda não está respondendo"
              fi
            else
              echo "[ERRO] Container API NÃO está rodando"
              docker logs volei-api --tail=30 2>&1 || echo "Não foi possível obter logs"
              exit 1
            fi

            # Verificar Frontend
            echo ""
            if docker ps --filter "name=volei-frontend" --format "{{.Names}}" | grep -q volei-frontend; then
              echo "[OK] Container Frontend está rodando"

              # Testar Frontend
              if docker exec volei-frontend curl -f http://localhost:8080 2>/dev/null; then
                echo "[OK] Frontend está respondendo"
              else
                echo "[AVISO] Frontend ainda não está respondendo"
              fi
            else
              echo "[ERRO] Container Frontend NÃO está rodando"
              docker logs volei-frontend --tail=30 2>&1 || echo "Não foi possível obter logs"
              exit 1
            fi

            # Verificar DNS (se cloudflare-dns-manager estiver rodando)
            echo ""
            echo "Verificando DNS..."
            if docker ps | grep -q cloudflare-dns-manager; then
              echo "[INFO] DNS Manager detectado - DNS deve ser criado automaticamente"
              docker logs cloudflare-dns-manager --tail=10 | grep "${VOLEI_DOMAIN}" || echo "Aguardando criação do DNS..."
            else
              echo "[AVISO] DNS Manager não detectado - configure DNS manualmente"
            fi

            echo ""
            echo "Deploy do Vôlei dos amigos concluído com sucesso!"
            echo ""
            echo "Acesse em: https://${VOLEI_DOMAIN}"
            echo "Aguarde 1-5 minutos para SSL ser gerado"
          ENDSSH

      - name: Deployment Summary
        if: always()
        env:
          VOLEI_DOMAIN: ${{ secrets.VOLEI_DOMAIN }}
          DEFAULT_EMAIL: ${{ secrets.DEFAULT_EMAIL }}
        run: |
          echo "=========================================="
          if [ ${{ job.status }} == 'success' ]; then
            echo "DEPLOY REALIZADO COM SUCESSO!"
            echo ""
            echo "URL: https://$VOLEI_DOMAIN"
            echo "Email SSL: $DEFAULT_EMAIL"
            echo ""
            echo "Serviços deployados:"
            echo "   - API (Express) - porta 3001 → conectado ao banco remoto"
            echo "   - Frontend (Vite) - porta 8080"
            echo ""
            echo "Aguarde 1-5 minutos para:"
            echo "   - DNS propagar"
            echo "   - Certificado SSL ser gerado"
          else
            echo "DEPLOY FALHOU!"
            echo ""
            echo "Verifique os logs acima para detalhes."
            echo "Ou acesse: Actions -> Este workflow -> Logs"
          fi
          echo "=========================================="
