name: Deploy Vôlei dos amigos

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/volei

jobs:
  deploy:
    name: Deploy Vôlei to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create Deployment Package
        run: |
          tar -czf volei-deploy.tar.gz \
            docker-compose.yml \
            Dockerfile \
            .dockerignore \
            schema.sql \
            package.json \
            package-lock.json

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          # Criar diretório remoto
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST "
            mkdir -p ${{ env.DEPLOY_PATH }}

            # Backup do .env se existir
            if [ -f ${{ env.DEPLOY_PATH }}/.env ]; then
              cp ${{ env.DEPLOY_PATH }}/.env ${{ env.DEPLOY_PATH }}/.env.backup
              echo 'Backup do .env criado'
            fi
          "

          # Enviar arquivos
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P $SSH_PORT volei-deploy.tar.gz $SSH_USER@$SSH_HOST:${{ env.DEPLOY_PATH }}/

          # Extrair
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST "
            cd ${{ env.DEPLOY_PATH }}
            tar -xzf volei-deploy.tar.gz
            rm volei-deploy.tar.gz

            # Restaurar .env
            if [ -f .env.backup ]; then
              mv .env.backup .env
              echo '.env restaurado'
            fi

            echo 'Arquivos extraídos'
          "

      - name: Deploy Application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          VOLEI_DOMAIN: ${{ secrets.VOLEI_DOMAIN }}
          DEFAULT_EMAIL: ${{ secrets.DEFAULT_EMAIL }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST || 'db' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST bash << EOF
            cd ${{ env.DEPLOY_PATH }}

            echo "Criando/Atualizando .env..."
            cat > .env << 'ENVFILE'
          # Proxy Reverso
          VOLEI_DOMAIN=$VOLEI_DOMAIN
          DEFAULT_EMAIL=$DEFAULT_EMAIL

          # Database
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          MYSQL_DATABASE=$MYSQL_DATABASE
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD

          # API Config
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_USER=$MYSQL_USER
          DB_PASSWORD=$MYSQL_PASSWORD
          DB_NAME=$MYSQL_DATABASE
          API_PORT=3001

          # Frontend Config
          VITE_API_URL=http://localhost:3001
          ENVFILE

            # Substituir variáveis no .env
            sed -i "s|\\\$VOLEI_DOMAIN|$VOLEI_DOMAIN|g" .env
            sed -i "s|\\\$DEFAULT_EMAIL|$DEFAULT_EMAIL|g" .env
            sed -i "s|\\\$MYSQL_ROOT_PASSWORD|$MYSQL_ROOT_PASSWORD|g" .env
            sed -i "s|\\\$MYSQL_DATABASE|$MYSQL_DATABASE|g" .env
            sed -i "s|\\\$MYSQL_USER|$MYSQL_USER|g" .env
            sed -i "s|\\\$MYSQL_PASSWORD|$MYSQL_PASSWORD|g" .env
            sed -i "s|\\\$DB_HOST|$DB_HOST|g" .env
            sed -i "s|\\\$DB_PORT|$DB_PORT|g" .env

            chmod 600 .env

            echo "Conteúdo do .env criado (valores ocultos):"
            sed 's/=.*/=***/' .env

            echo "Construindo imagens..."
            docker-compose -p volei build --no-cache

            echo "Parando containers antigos..."
            docker-compose -p volei down 2>/dev/null || true

            echo "Subindo serviços..."
            docker-compose -p volei up -d

            echo "Aguardando inicialização (30s)..."
            sleep 30

            echo "Status dos containers:"
            docker ps --filter "name=volei" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "Últimos logs do database:"
            docker logs volei-db --tail=20

            echo ""
            echo "Últimos logs da API:"
            docker logs volei-api --tail=20

            echo ""
            echo "Últimos logs do frontend:"
            docker logs volei-frontend --tail=20
          EOF

      - name: Health Check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          VOLEI_DOMAIN: ${{ secrets.VOLEI_DOMAIN }}
        run: |
          sleep 10
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}

            echo "Verificando saúde dos serviços..."
            echo ""

            # Verificar Database
            if docker ps --filter "name=volei-db" --format "{{.Names}}" | grep -q volei-db; then
              echo "[OK] Container Database está rodando"

              # Testar conexão com o banco
              if docker exec volei-db mysqladmin ping -h localhost 2>/dev/null | grep -q "alive"; then
                echo "[OK] Database está respondendo"
              else
                echo "[AVISO] Database ainda não está respondendo"
              fi
            else
              echo "[ERRO] Container Database NÃO está rodando"
              docker logs volei-db --tail=30 2>&1 || echo "Não foi possível obter logs"
              exit 1
            fi

            # Verificar API
            echo ""
            if docker ps --filter "name=volei-api" --format "{{.Names}}" | grep -q volei-api; then
              echo "[OK] Container API está rodando"

              # Testar API
              if docker exec volei-api curl -f http://localhost:3001/api/players 2>/dev/null; then
                echo "[OK] API está respondendo"
              else
                echo "[AVISO] API ainda não está respondendo"
              fi
            else
              echo "[ERRO] Container API NÃO está rodando"
              docker logs volei-api --tail=30 2>&1 || echo "Não foi possível obter logs"
              exit 1
            fi

            # Verificar Frontend
            echo ""
            if docker ps --filter "name=volei-frontend" --format "{{.Names}}" | grep -q volei-frontend; then
              echo "[OK] Container Frontend está rodando"

              # Testar Frontend
              if docker exec volei-frontend curl -f http://localhost:8080 2>/dev/null; then
                echo "[OK] Frontend está respondendo"
              else
                echo "[AVISO] Frontend ainda não está respondendo"
              fi
            else
              echo "[ERRO] Container Frontend NÃO está rodando"
              docker logs volei-frontend --tail=30 2>&1 || echo "Não foi possível obter logs"
              exit 1
            fi

            # Verificar DNS (se cloudflare-dns-manager estiver rodando)
            echo ""
            echo "Verificando DNS..."
            if docker ps | grep -q cloudflare-dns-manager; then
              echo "[INFO] DNS Manager detectado - DNS deve ser criado automaticamente"
              docker logs cloudflare-dns-manager --tail=10 | grep "${VOLEI_DOMAIN}" || echo "Aguardando criação do DNS..."
            else
              echo "[AVISO] DNS Manager não detectado - configure DNS manualmente"
            fi

            echo ""
            echo "Deploy do Vôlei dos amigos concluído com sucesso!"
            echo ""
            echo "Acesse em: https://${VOLEI_DOMAIN}"
            echo "Aguarde 1-5 minutos para SSL ser gerado"
          ENDSSH

      - name: Deployment Summary
        if: always()
        env:
          VOLEI_DOMAIN: ${{ secrets.VOLEI_DOMAIN }}
          DEFAULT_EMAIL: ${{ secrets.DEFAULT_EMAIL }}
        run: |
          echo "=========================================="
          if [ ${{ job.status }} == 'success' ]; then
            echo "DEPLOY REALIZADO COM SUCESSO!"
            echo ""
            echo "URL: https://$VOLEI_DOMAIN"
            echo "Email SSL: $DEFAULT_EMAIL"
            echo ""
            echo "Serviços deployados:"
            echo "   - Database (MariaDB 11) - porta 3306"
            echo "   - API (Express) - porta 3001"
            echo "   - Frontend (Vite) - porta 8080"
            echo ""
            echo "Aguarde 1-5 minutos para:"
            echo "   - DNS propagar"
            echo "   - Certificado SSL ser gerado"
          else
            echo "DEPLOY FALHOU!"
            echo ""
            echo "Verifique os logs acima para detalhes."
            echo "Ou acesse: Actions -> Este workflow -> Logs"
          fi
          echo "=========================================="
